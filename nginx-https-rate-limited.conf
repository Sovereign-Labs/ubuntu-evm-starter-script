worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /usr/local/openresty/nginx/logs/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # Base HTTP configuration (Cloudflare, logging, buffers, backend refresh, etc.)
    include conf.d/http-base.conf;

    # Token bucket rate limiting setup (shared dicts, Lua module loading)
    include conf.d/token-bucket-setup.conf;

    # HTTP server - redirect to HTTPS (except health check and ACME)
    server {
        listen 80;
        server_name {{DOMAIN_NAME}};

        location /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server with rate limiting
    server {
        listen 443 ssl;
        http2 on;
        server_name {{DOMAIN_NAME}};

        include conf.d/ssl.conf;
        include conf.d/security-headers.conf;

        location /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # WebSocket endpoints (Lua-handled: /rpc and *.../ws)
        include conf.d/websocket-proxy.conf;

        # All other requests (with token bucket rate limiting)
        include conf.d/proxy-location-rate-limited.conf;
    }
}
