# WebSocket proxy location with token bucket rate limiting
# Included in server {} blocks
#
# Handles:
# - /rpc (JSON-RPC WebSocket with per-method routing)
# - Any path ending in /ws (REST WebSocket endpoints)
#
# Non-WebSocket requests to these paths are rewritten to the main handler.

location ~ ^(?!/_main_handler)(/rpc|.*/ws)$ {
    # Detect WebSocket upgrade request (case-insensitive)
    set $is_websocket 0;
    if ($http_upgrade ~* "websocket") {
        set $is_websocket 1;
    }

    # Non-WebSocket requests fall through to main proxy handler
    if ($is_websocket = 0) {
        rewrite ^(.*)$ /_main_handler$1 last;
    }

    # WebSocket proxy with rate limiting and backend routing
    # Lua handles: connection setup, per-message rate limiting, backend routing
    content_by_lua_block {
        proxy.handle_websocket()
    }
}
