# WebSocket proxy locations with token bucket rate limiting
# Included in server {} blocks
#
# Handles:
# - /rpc (JSON-RPC: supports both HTTP and WebSocket)
# - Any path ending in /ws (WebSocket only)

# /rpc endpoint - supports both HTTP JSON-RPC and WebSocket
location = /rpc {
    set $is_websocket 0;
    if ($http_upgrade ~* "websocket") {
        set $is_websocket 1;
    }

    # Non-WebSocket requests fall through to main HTTP handler
    if ($is_websocket = 0) {
        rewrite ^(.*)$ /_main_handler$1 last;
    }

    # WebSocket: Lua handles connection, per-message rate limiting, backend routing
    content_by_lua_block {
        proxy.handle_websocket()
    }
}

# REST WebSocket endpoints (*.../ws) - WebSocket only
location ~ ^(?!/_main_handler).*/ws$ {
    # Reject non-WebSocket requests
    if ($http_upgrade !~* "websocket") {
        return 426;
    }

    # WebSocket: Lua handles connection, per-message rate limiting, backend routing
    content_by_lua_block {
        proxy.handle_websocket()
    }
}
