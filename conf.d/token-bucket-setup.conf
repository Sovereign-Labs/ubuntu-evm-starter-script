# Token bucket rate limiting setup
# Included in the http {} block for deployments using Lua-based rate limiting
#
# This provides per-request-type cost accounting via a token bucket algorithm.
# Works alongside nginx's built-in limit_req_zone for defense in depth.

# Define IP addresses exempt from token bucket rate limiting
# These IPs bypass the Lua rate limiter but still go through limit_req_zone
geo $rate_limit_override {
    default 0;
    # Add exempt IPs here:
    # 10.0.0.1 1;  # Example: internal service
    # RATE_LIMIT_EXEMPT_PLACEHOLDER
}

# Shared memory for token buckets (10MB = ~100k client buckets)
lua_shared_dict token_buckets 10m;

# Lua module path - load helpers from nginx config directory
lua_package_path "/usr/local/openresty/nginx/conf/conf.d/?.lua;;";

# Load the proxy helpers module at init time (cached for all workers)
init_by_lua_block {
    proxy = require "nginx-proxy-helpers"
}
