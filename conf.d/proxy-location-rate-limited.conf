# Main proxy location with token bucket rate limiting
# Included in server {} blocks
#
# Provides two entry points:
# - @http_handler: Named location for internal redirects (from /rpc HTTP fallback)
# - /: Catch-all for regular HTTP requests
#
# DEPENDENCY: Requires http-base.conf for the $connection_upgrade map used
# in WebSocket upgrade header handling.

# Named location for HTTP requests redirected from /rpc via ngx.exec()
location @http_handler {
    internal;

    set $backend '';

    access_by_lua_block {
        proxy.handle_http_request(ngx.var.uri, ngx.var.request_method)
    }

    proxy_pass http://$backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_connect_timeout 5s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
}

# Catch-all for regular HTTP requests
location ~ ^/ {
    set $backend '';

    access_by_lua_block {
        proxy.handle_http_request(ngx.var.uri, ngx.var.request_method)
    }

    proxy_pass http://$backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_connect_timeout 5s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
}
