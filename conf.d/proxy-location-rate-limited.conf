# Main proxy location with token bucket rate limiting
# Included in server {} blocks
#
# Features:
# - Per-endpoint/method cost accounting via token bucket
# - Dynamic backend selection (leader vs follower)
# - JSON-RPC method extraction for routing and cost
# - Rate limit headers on responses
#
# Note: Also handles /_main_handler prefix from WebSocket fallback rewrites

location ~ ^/(_main_handler)?(.*)$ {
    set $backend '';

    access_by_lua_block {
        local uri = ngx.var[2] or ngx.var.uri
        -- Ensure uri starts with /
        if uri and uri ~= "" and string.sub(uri, 1, 1) ~= "/" then
            uri = "/" .. uri
        end
        if not uri or uri == "" then uri = "/" end
        -- Remove _main_handler prefix if present
        if string.sub(uri, 1, 14) == "/_main_handler" then
            uri = string.sub(uri, 15)
        end

        proxy.handle_http_request(uri, ngx.var.request_method)
    }

    proxy_pass http://$backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support (for non-Lua-handled WebSocket paths)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Timeouts - long for WebSocket support
    proxy_connect_timeout 5s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
}
