# API key URL pattern handler - rewrites /rpc/<key> to /rpc
# Auth validation happens in Lua handlers via M.validate_api_key()
#
# Flow:
# 1. Request arrives at /rpc/<key> (e.g., /rpc/abc123)
# 2. nginx evaluates $valid_api_key map (in http-base.conf) using $request_uri
# 3. This location rewrites URI to /rpc
# 4. location = /rpc matches, Lua handler runs
# 5. M.validate_api_key() checks $valid_api_key and $require_api_key

# Match /rpc/<key> - rewrite to /rpc for standard handling
# The $request_uri (used by $valid_api_key map) is preserved across rewrites
location ~ ^/rpc/([a-zA-Z0-9_-]+)/?$ {
    rewrite ^ /rpc last;  # Re-match to location = /rpc
}
