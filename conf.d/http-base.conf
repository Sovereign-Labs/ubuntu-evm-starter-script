# Common HTTP-level configuration
# Included in the http {} block of main nginx configs

# Use https://nginx.org/en/docs/http/ngx_http_realip_module.html
# to set the correct origin IP address even when proxied through Cloudflare
# https://developers.cloudflare.com/fundamentals/reference/http-headers/
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Only trust CF-Connecting-IP header from these Cloudflare IPs to prevent spoofing
# (https://www.cloudflare.com/ips/)

# IPv4 ranges
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
# IPv6 ranges
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# GeoIP setup (real or stub depending on whether GeoIP is enabled)
include conf.d/geoip-setup.conf;

# Define IP addresses exempt from rate limiting
geo $ip_exempt {
    default 0;
    # 10.0.0.1 1;  # Example: exempt internal service
    # IP_EXEMPT_PLACEHOLDER
}

# Define hostnames exempt from rate limiting (optional)
map $host $host_exempt {
    default 0;
    # "internal.example.com" 1;  # Example: exempt internal hostname
    # HOST_EXEMPT_PLACEHOLDER
}

# Combine IP and host exemptions: bypass rate limiting if EITHER is exempt
# Used by Lua token bucket: ngx.var.rate_limit_key == "1" means exempt
# Only "0:0" (neither exempt) applies rate limiting; all other cases bypass
map "$ip_exempt:$host_exempt" $rate_limit_key {
    "0:0"   0;
    default 1;
}

include /usr/local/openresty/nginx/conf/mime.types;
default_type application/json;

log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent" "$http_x_forwarded_for" '
                'rt=$request_time backend=$upstream_addr';

access_log /var/log/nginx/access.log main;

sendfile on;
tcp_nopush on;
tcp_nodelay on;
keepalive_timeout 65;
keepalive_requests 1000;

# Shared memory for caching backend IPs
lua_shared_dict backend_cache 1m;

# Shared memory for rate limiting failed auth attempts
lua_shared_dict failed_auth_limit 10m;

# Shared memory for token buckets (10MB = ~100k client buckets)
lua_shared_dict token_buckets 10m;

# Shared memory for token bucket locks.
lua_shared_dict token_bucket_locks 1m;

# Lua module path for shared modules
lua_package_path "/usr/local/openresty/nginx/conf/conf.d/?.lua;;";

# Load the proxy helpers module and initialize backend cache once on config load.
init_by_lua_block {
    proxy = require "nginx-proxy-helpers"

    local ok, err = pcall(dofile, "/usr/local/openresty/nginx/conf/backends.generated.lua")
    if not ok then
        ngx.log(ngx.WARN, "failed to load backends.generated.lua: ", err)
    end
}

init_worker_by_lua_block {
    ngx.log(ngx.NOTICE, "init_worker_by_lua_block worker_id=", ngx.worker.id())

    local backend_cache = ngx.shared.backend_cache
    local keys = backend_cache:get_keys(0)
    if not keys or #keys == 0 then
        ngx.log(ngx.NOTICE, "backend_cache is empty after loading backends.generated.lua")
    else
        table.sort(keys)
        for _, key in ipairs(keys) do
            ngx.log(ngx.NOTICE, "backend_cache[", key, "]=", backend_cache:get(key))
        end
    end
}

# Gzip compression
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types
    application/json
    text/plain
    text/css
    application/javascript
    text/xml
    application/xml
    application/xml+rss
    text/javascript;

# Buffer sizes - contract deployments can exceed 1MB after hex encoding.
client_body_buffer_size 2m;
client_max_body_size 2m;
client_header_buffer_size 1k;
large_client_header_buffers 4 4k;

# DNS resolver for dynamic proxy_pass - AWS VPC DNS: https://docs.aws.amazon.com/vpc/latest/userguide/AmazonDNS-concepts.html
resolver 169.254.169.253 valid=10s;

# Proxy settings
proxy_buffering on;
proxy_buffer_size 64k;
proxy_buffers 8 64k;
proxy_busy_buffers_size 128k;
proxy_http_version 1.1;

# WebSocket connection upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# API key validation map - checks if request URI contains a valid key
# Uses $request_uri (not $uri) because $uri gets rewritten before access phase.
map $request_uri $valid_api_key {
    {{API_KEYS}}
    default 0;
}
