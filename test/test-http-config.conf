# Test HTTP-level configuration
# This is the http {} block content for Test::Nginx
# Uses includes for reusable components, adds mock backends for testing

# Rate limit exemption (for testing - no IPs exempt by default)
geo $rate_limit_override {
    default 0;
    # Tests can override this by regex substitution to add exemptions
}

# Shared memory for caching backend IPs and token buckets
lua_shared_dict backend_cache 1m;
lua_shared_dict token_buckets 10m;

# Lua module path - point to conf.d where nginx-proxy-helpers.lua lives
lua_package_path "/home/cem/ubuntu-evm-starter-script/conf.d/?.lua;;";

# Load the proxy helpers module at init time
init_by_lua_block {
    proxy = require "nginx-proxy-helpers"

    -- Inject test JSON-RPC methods (keeps production code clean)
    proxy.jsonrpc_methods["test_leader_write"] = { cost = 80, use_leader = true }
    proxy.jsonrpc_methods["test_follower_read"] = { cost = 80, use_leader = false }
    proxy.jsonrpc_methods["test_subscribe"] = { cost = 5, use_leader = false }
    proxy.jsonrpc_methods["test_leader_close"] = { cost = 80, use_leader = true }
    proxy.jsonrpc_methods["test_follower_close"] = { cost = 80, use_leader = false }

    -- Inject test REST endpoint with unique cost (123) to verify pattern matching
    -- Routes to leader to differentiate from default (follower)
    proxy.rest_endpoints["/test/param/{id}"] = { cost = 123, use_leader = true }
    table.insert(proxy.rest_patterns, {
        pattern = "^/test/param/[^/]+$",
        config = { cost = 123, use_leader = true }
    })
}

# Initialize backends with test addresses
init_worker_by_lua_block {
    ngx.shared.backend_cache:set("leader", "127.0.0.1:12346")
    ngx.shared.backend_cache:set("follower", "127.0.0.2:12346")
}

# DNS resolver for dynamic proxy_pass
resolver 8.8.8.8 valid=10s;

# WebSocket connection upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Mock leader backend server
server {
    listen 127.0.0.1:12346;

    location /rpc {
        content_by_lua_block {
            if ngx.var.http_upgrade and ngx.var.http_upgrade:lower() == "websocket" then
                local server = require "resty.websocket.server"
                local wb, err = server:new{ timeout = 5000, max_payload_len = 65535 }
                if not wb then return ngx.exit(400) end

                local sock = wb.sock
                if sock then sock:settimeout(0); sock:receive(2); sock:settimeout(5000) end

                while true do
                    local data, typ, err = wb:recv_frame()
                    if not data then break end
                    if typ == "close" then wb:send_close(); break
                    elseif typ == "text" then
                        local method = data:match('"method"%s*:%s*"([^"]+)"')
                        if method == "test_leader_close" or method == "test_follower_close" then
                            wb:send_text('{"jsonrpc":"2.0","result":"closing","id":1}')
                            wb:send_close(); break
                        elseif method == "eth_subscribe" or method == "test_subscribe" then
                            wb:send_text('{"jsonrpc":"2.0","result":"0xabc123","id":1}')
                            ngx.sleep(0.01)
                            wb:send_text('{"jsonrpc":"2.0","method":"eth_subscription","params":{"subscription":"0xabc123","result":{"number":"0x1"}}}')
                            ngx.sleep(0.01)
                            wb:send_text('{"jsonrpc":"2.0","method":"eth_subscription","params":{"subscription":"0xabc123","result":{"number":"0x2"}}}')
                        else
                            wb:send_text('{"jsonrpc":"2.0","result":"leader","id":1}')
                        end
                    end
                end
            else
                ngx.header["X-Backend"] = "leader"
                ngx.print('{"backend":"leader"}')
            end
        }
    }

    location / {
        content_by_lua_block {
            if ngx.var.http_upgrade and ngx.var.http_upgrade:lower() == "websocket" then
                local server = require "resty.websocket.server"
                local wb, err = server:new{ timeout = 5000, max_payload_len = 65535 }
                if not wb then return ngx.exit(400) end
                local sock = wb.sock
                if sock then sock:settimeout(0); sock:receive(2); sock:settimeout(5000) end
                while true do
                    local data, typ, err = wb:recv_frame()
                    if not data then break end
                    if typ == "close" then wb:send_close(); break
                    elseif typ == "text" then
                        wb:send_text('{"result":"leader_rest"}')
                    end
                end
            else
                ngx.header["X-Backend"] = "leader"
                ngx.print('{"backend":"leader"}')
            end
        }
    }
}

