worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /usr/local/openresty/nginx/logs/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # Base HTTP configuration (Cloudflare, logging, buffers, backend refresh, Lua rate limiting)
    include conf.d/http-base.conf;

    # Enable VTS for metrics collection
    vhost_traffic_status_zone;

    # Monitoring server (localhost only)
    server {
        listen 127.0.0.1:8080;

        location /vts_status {
            vhost_traffic_status_display;
            vhost_traffic_status_display_format json;
            access_log off;
        }
    }

    # HTTP server for public domain(s) - redirect to HTTPS
    server {
        listen 80 default_server;
        server_name {{DOMAIN_NAME}};

        include conf.d/geoip-block.conf;
        include conf.d/common-locations.conf;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTP server for secure domain(s) - redirect to HTTPS
    server {
        listen 80;
        server_name {{SECURE_DOMAIN_NAMES}};

        include conf.d/common-locations.conf;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server for public domain - no API key required, standard rate limits
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name {{DOMAIN_NAME}};

        include conf.d/geoip-block.conf;
        include conf.d/ssl.conf;
        include conf.d/security-headers.conf;

        # Disable API key requirement for public endpoint
        set $require_api_key 0;

        # Rate limits for public (non-authenticated) clients
        set $bucket_capacity 150;   # 150 tokens
        set $refill_rate 150;       # 150 tokens/sec
        set $rate_limit_tier public;

        include conf.d/common-locations.conf;
        include conf.d/websocket-proxy.conf;
        include conf.d/http-proxy.conf;
    }

    # HTTPS server for secure domain(s) - API key required, higher rate limits
    server {
        listen 443 ssl;
        http2 on;
        server_name {{SECURE_DOMAIN_NAMES}} _;

        include conf.d/ssl.conf;
        include conf.d/security-headers.conf;

        # Enable API key validation in Lua handlers
        set $require_api_key 1;

        # Higher rate limits for authenticated clients
        set $bucket_capacity 500;   # 500 tokens (vs 150 for public)
        set $refill_rate 500;       # 500 tokens/sec (vs 150 for public)
        set $rate_limit_tier authenticated;

        # Handle /rpc/<key> URL pattern -> rewrites to /rpc
        include conf.d/api-key-locations.conf;

        include conf.d/common-locations.conf;
        include conf.d/websocket-proxy.conf;
        include conf.d/http-proxy.conf;
    }
}
